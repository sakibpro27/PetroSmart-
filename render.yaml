# Render Blueprint: Render reads this file and creates the PetroSmart web app
# and its PostgreSQL database with every setting filled in.
#
# Use it from dashboard.render.com: New -> Blueprint -> choose this GitHub
# repository -> Apply. Render then asks only for the three DJANGO_SUPERUSER_*
# values (your platform admin login), which must never be stored in GitHub.
#
# Free plans change; check Render's current limits (the free database expires
# after a time). Free hosting is for demonstrations, not real dealers' data.

databases:
  - name: petrosmart-db
    plan: free
    databaseName: petrosmart
    user: petrosmart

services:
  - type: web
    name: petrosmart-web
    runtime: python
    plan: free
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate &&
      (python manage.py createsuperuser --noinput || true)
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.2
      - key: DJANGO_SECRET_KEY
        generateValue: true          # random, created by Render, never in GitHub
      - key: DJANGO_DEBUG
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: petrosmart-db
          property: connectionString
      - key: DJANGO_BEHIND_PROXY
        value: "True"
      - key: DJANGO_SECURE_COOKIES
        value: "True"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: PETROSMART_ADMIN_PATH
        value: platform-admin/
      # Your platform admin login: Render asks for these when you apply the Blueprint.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false

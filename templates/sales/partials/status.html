{% if status == "APPROVED" %}<span class="status status-success"><i class="bi bi-check-circle" aria-hidden="true"></i> {{ label }}</span>{% elif status == "SUBMITTED" or status == "PENDING" %}<span class="status status-warning"><i class="bi bi-hourglass-split" aria-hidden="true"></i> {{ label }}</span>{% elif status == "REJECTED" %}<span class="status status-danger"><i class="bi bi-x-circle" aria-hidden="true"></i> {{ label }}</span>{% else %}<span class="status status-neutral"><i class="bi bi-pencil" aria-hidden="true"></i> {{ label }}</span>{% endif %}

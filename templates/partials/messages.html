{% if messages %}
  {% for message in messages %}
    <div class="alert alert-{{ message.tags|default:'info' }}" role="{% if message.level >= 40 %}alert{% else %}status{% endif %}">
      {% if message.level >= 40 %}<i class="bi bi-exclamation-octagon" aria-hidden="true"></i>
      {% elif message.level >= 30 %}<i class="bi bi-exclamation-triangle" aria-hidden="true"></i>
      {% elif message.level == 25 %}<i class="bi bi-check-circle" aria-hidden="true"></i>
      {% else %}<i class="bi bi-info-circle" aria-hidden="true"></i>{% endif %}
      <div>{{ message }}</div>
    </div>
  {% endfor %}
{% endif %}
